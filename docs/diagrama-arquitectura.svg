<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7f7f2"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#163e31">PRIVACYOS — Arquitectura cliente-servidor</text><text x="48" y="88" font-family="Arial,sans-serif" font-size="16" fill="#52665b">Componentes implementados y límites del análisis</text><rect x="55" y="140" width="300" height="470" rx="18" fill="#fff" stroke="#b9cec0" stroke-width="2"/><rect x="55" y="140" width="300" height="60" rx="18" fill="#163e31"/><text x="205" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">1. Cliente web</text><text x="80" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#163e31">Next.js · React · TypeScript</text><text x="80" y="275" font-family="Arial,sans-serif" font-size="15" fill="#52665b">• Interfaz responsive</text><text x="80" y="305" font-family="Arial,sans-serif" font-size="15" fill="#52665b">• Dashboard y navegación</text><text x="80" y="335" font-family="Arial,sans-serif" font-size="15" fill="#52665b">• Nuevo análisis y resultados</text><text x="80" y="365" font-family="Arial,sans-serif" font-size="15" fill="#52665b">• Historial local</text><text x="80" y="415" font-family="Arial,sans-serif" font-size="13" fill="#52665b">Persistencia local del navegador</text><path d="M355 375H430" stroke="#628b76" stroke-width="4"/><path d="M418 363L432 375L418 387" stroke="#628b76" stroke-width="4" fill="none"/><text x="392" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52665b">POST</text><rect x="435" y="140" width="330" height="470" rx="18" fill="#fff" stroke="#b9cec0" stroke-width="2"/><rect x="435" y="140" width="330" height="60" rx="18" fill="#24644d"/><text x="600" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">2. Servidor</text><text x="460" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#163e31">POST /api/analyze</text><rect x="460" y="260" width="280" height="68" rx="10" fill="#e3efe6" stroke="#b9cec0"/><text x="600" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#163e31">Validación y seguridad</text><text x="600" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52665b">Zod · DNS · puertos · anti-SSRF</text><path d="M600 328V350" stroke="#628b76" stroke-width="3"/><rect x="460" y="350" width="280" height="82" rx="10" fill="#e3efe6" stroke="#b9cec0"/><text x="600" y="379" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#163e31">Motor de análisis</text><text x="600" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52665b">HTTP · headers · cookies · HTML inicial</text><text x="600" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52665b">Hallazgos basados en evidencia observada</text><text x="460" y="475" font-family="Arial,sans-serif" font-size="14" fill="#52665b">Respuesta: resultados y evidencias</text><text x="460" y="510" font-family="Arial,sans-serif" font-size="13" fill="#52665b">No realiza crawling exhaustivo.</text><text x="460" y="535" font-family="Arial,sans-serif" font-size="13" fill="#52665b">No emite certificación legal.</text><path d="M765 375H840" stroke="#628b76" stroke-width="4"/><path d="M828 363L842 375L828 387" stroke="#628b76" stroke-width="4" fill="none"/><rect x="845" y="140" width="300" height="470" rx="18" fill="#fff" stroke="#b9cec0" stroke-width="2"/><rect x="845" y="140" width="300" height="60" rx="18" fill="#52665b"/><text x="995" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">3. Sitio externo</text><text x="870" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#163e31">URL pública analizada</text><text x="870" y="275" font-family="Arial,sans-serif" font-size="15" fill="#52665b">• Solicitud HTTP limitada</text><text x="870" y="305" font-family="Arial,sans-serif" font-size="15" fill="#52665b">• Cabeceras de respuesta</text><text x="870" y="335" font-family="Arial,sans-serif" font-size="15" fill="#52665b">• Cookies iniciales</text><text x="870" y="365" font-family="Arial,sans-serif" font-size="15" fill="#52665b">• HTML acotado y robots.txt</text><rect x="870" y="415" width="250" height="110" rx="12" fill="#fff4e3" stroke="#d6b77c" stroke-width="2"/><text x="995" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#815b1c">Fuera del alcance actual</text><text x="995" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#815b1c">Base de datos multiusuario</text><text x="995" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#815b1c">Autenticación y monitoreo continuo</text><text x="48" y="700" font-family="Arial,sans-serif" font-size="13" fill="#52665b">Fuente: elaboración del equipo a partir de la estructura del código y el producto desplegado.</text></svg>