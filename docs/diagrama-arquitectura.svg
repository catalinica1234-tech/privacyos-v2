<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F5545"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C08A3E"/>
    </marker>
  </defs>

  <rect width="1400" height="940" fill="#FAF9F4"/>

  <text x="44" y="52" font-size="30" font-weight="700" fill="#2F5545">PRIVACYOS — Diagrama de arquitectura</text>
  <text x="44" y="78" font-size="14" fill="#6E6A61">Modelo cliente-servidor · multicapa · con los nombres reales de los componentes desplegados (privacyos-v2.vercel.app)</text>

  <!-- leyenda -->
  <rect x="980" y="28" width="400" height="46" rx="10" fill="#FFFFFF" stroke="#DCD6C8"/>
  <rect x="996" y="44" width="22" height="14" fill="#EAF2EE" stroke="#2F5545"/>
  <text x="1026" y="56" font-size="12" fill="#2B2B28">Implementado y verificado hoy</text>
  <rect x="1206" y="44" width="22" height="14" fill="#FDF9F0" stroke="#C08A3E" stroke-dasharray="4 3"/>
  <text x="1236" y="56" font-size="12" fill="#2B2B28">Planificado · Hito 2</text>

  <!-- ============ COLUMNAS ============ -->
  <!-- CLIENTE -->
  <rect x="40" y="120" width="380" height="610" rx="16" fill="#FFFFFF" stroke="#2F5545" stroke-width="2"/>
  <path d="M40,136 q0,-16 16,-16 h348 q16,0 16,16 v38 h-380 z" fill="#2F5545"/>
  <text x="62" y="142" font-size="15" font-weight="700" fill="#FFFFFF">1 · CLIENTE</text>
  <text x="62" y="162" font-size="11" fill="#CBE5DB">Navegador del usuario · React 19 + Next.js 15 (SPA)</text>

  <rect x="60" y="192" width="360" height="276" rx="10" fill="#F3F7F5" stroke="#DDE7E2"/>
  <rect x="60" y="192" width="3" height="276" rx="1.5" fill="#2E8F73"/>
  <text x="76" y="216" font-size="13" font-weight="700" fill="#2F5545">Capa de presentación (SPA)</text>
  <text x="76" y="233" font-size="10.5" font-family="Consolas, monospace" fill="#3E4A44">app/**/page.tsx · components/landing.tsx</text>
  <g font-size="11" fill="#2B2B28">
    <rect x="74" y="246" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="84" y="266">Landing · <tspan font-family="Consolas, monospace" fill="#5B7A6E">/</tspan></text>
    <rect x="244" y="246" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="254" y="266">Dashboard</text>
    <rect x="74" y="282" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="84" y="302">Nuevo análisis</text>
    <rect x="244" y="282" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="254" y="302">Progreso</text>
    <rect x="74" y="318" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="84" y="338">Informe (5 pestañas)</text>
    <rect x="244" y="318" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="254" y="338">Historial</text>
    <rect x="74" y="354" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="84" y="374">Comparar</text>
    <rect x="244" y="354" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="254" y="374">Regulatorio</text>
    <rect x="74" y="390" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="84" y="410">Derechos</text>
    <rect x="244" y="390" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="254" y="410">Perfil</text>
    <rect x="74" y="426" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#D9E2DC"/><text x="84" y="446">Configuración</text>
  </g>

  <rect x="60" y="480" width="360" height="64" rx="10" fill="#F3F7F5" stroke="#DDE7E2"/>
  <rect x="60" y="480" width="3" height="64" rx="1.5" fill="#2E8F73"/>
  <text x="76" y="502" font-size="13" font-weight="700" fill="#2F5545">Capa de contratos — Zod</text>
  <text x="76" y="519" font-size="10.5" font-family="Consolas, monospace" fill="#3E4A44">lib/contracts.ts</text>
  <text x="76" y="536" font-size="10.5" fill="#4B4A45">misma validación en cliente y servidor</text>

  <rect x="60" y="556" width="360" height="160" rx="10" fill="#F3F7F5" stroke="#DDE7E2"/>
  <rect x="60" y="556" width="3" height="160" rx="1.5" fill="#2E8F73"/>
  <text x="76" y="580" font-size="13" font-weight="700" fill="#2F5545">Capa de persistencia (local)</text>
  <text x="76" y="597" font-size="10.5" font-family="Consolas, monospace" fill="#3E4A44">lib/store.ts · localStorage</text>
  <text x="76" y="620" font-size="11" fill="#4B4A45">· Historial, perfil y preferencias en el navegador</text>
  <text x="76" y="640" font-size="11" fill="#4B4A45">· Sin base de datos en esta fase (declarado en la UI)</text>
  <text x="76" y="660" font-size="11" fill="#4B4A45">· Capa aislada: migra a BD en Hito 2 sin tocar pantallas</text>

  <!-- SERVIDOR -->
  <rect x="520" y="120" width="400" height="610" rx="16" fill="#FFFFFF" stroke="#2F5545" stroke-width="2"/>
  <path d="M520,136 q0,-16 16,-16 h368 q16,0 16,16 v38 h-400 z" fill="#2F5545"/>
  <text x="542" y="142" font-size="15" font-weight="700" fill="#FFFFFF">2 · SERVIDOR</text>
  <text x="542" y="162" font-size="11" fill="#CBE5DB">Vercel serverless · Node.js · Stateless</text>

  <rect x="540" y="192" width="360" height="86" rx="10" fill="#F3F7F5" stroke="#DDE7E2"/>
  <rect x="540" y="192" width="3" height="86" rx="1.5" fill="#2E8F73"/>
  <text x="556" y="216" font-size="13" font-weight="700" fill="#2F5545">Endpoint de análisis</text>
  <text x="556" y="236" font-size="10.5" font-family="Consolas, monospace" fill="#3E4A44">POST /api/analyze — app/api/analyze/route.ts</text>
  <text x="556" y="256" font-size="10.5" fill="#4B4A45">runtime Node.js · igual en local que en producción</text>

  <rect x="540" y="292" width="360" height="152" rx="10" fill="#F3F7F5" stroke="#DDE7E2"/>
  <rect x="540" y="292" width="3" height="152" rx="1.5" fill="#2E8F73"/>
  <text x="556" y="316" font-size="13" font-weight="700" fill="#2F5545">Capa de seguridad</text>
  <text x="556" y="333" font-size="10.5" font-family="Consolas, monospace" fill="#3E4A44">lib/analyzer/safety.ts</text>
  <text x="556" y="356" font-size="11" fill="#4B4A45">· Solo HTTP/HTTPS · puertos 80/443</text>
  <text x="556" y="374" font-size="11" fill="#4B4A45">· DNS resuelto y validado antes de salir</text>
  <text x="556" y="392" font-size="11" fill="#4B4A45">· Bloqueo de IP privadas y metadatos cloud (SSRF)</text>
  <text x="556" y="410" font-size="11" fill="#4B4A45">· Redirecciones revalidadas · pruebas en local ✓</text>

  <rect x="540" y="458" width="360" height="176" rx="10" fill="#F3F7F5" stroke="#DDE7E2"/>
  <rect x="540" y="458" width="3" height="176" rx="1.5" fill="#2E8F73"/>
  <text x="556" y="482" font-size="13" font-weight="700" fill="#2F5545">Capa de dominio — motor</text>
  <text x="556" y="499" font-size="10.5" font-family="Consolas, monospace" fill="#3E4A44">lib/analyzer/engine.ts · lib/frameworks.ts</text>
  <text x="556" y="520" font-size="11" fill="#4B4A45">· Descarga real del sitio (fetch)</text>
  <text x="556" y="538" font-size="11" fill="#4B4A45">· Hallazgos solo con evidencia observada</text>
  <text x="556" y="556" font-size="11" fill="#4B4A45">· Score derivado · presupuesto de tiempo</text>
  <text x="556" y="574" font-size="11" fill="#4B4A45">· Contexto legal: Ley 19.628 · 21.719 · RGPD</text>
  <text x="556" y="592" font-size="11" fill="#4B4A45">· Plan de medidas priorizado</text>

  <text x="540" y="664" font-size="11" font-style="italic" fill="#6E6A61">Stateless: el resultado vuelve al cliente;</text>
  <text x="540" y="682" font-size="11" font-style="italic" fill="#6E6A61">nada se guarda en el servidor hoy.</text>

  <!-- SERVICIO EXTERNO -->
  <rect x="1000" y="120" width="380" height="170" rx="16" fill="#FFFFFF" stroke="#4A4740" stroke-width="2"/>
  <path d="M1000,136 q0,-16 16,-16 h348 q16,0 16,16 v38 h-380 z" fill="#4A4740"/>
  <text x="1022" y="142" font-size="15" font-weight="700" fill="#FFFFFF">3 · SERVICIO EXTERNO</text>
  <text x="1022" y="162" font-size="11" fill="#D8D6D0">Sitio web a evaluar (internet público)</text>
  <text x="1022" y="206" font-size="11" font-family="Consolas, monospace" fill="#3E4A44">p. ej. www.chile.gob.cl</text>
  <text x="1022" y="232" font-size="11" fill="#4B4A45">· Solo acceso de lectura (GET)</text>
  <text x="1022" y="252" font-size="11" fill="#4B4A45">· Entrega HTML · headers · cookies</text>
  <text x="1022" y="272" font-size="11" fill="#4B4A45">· El motor nunca envía datos del usuario al sitio</text>

  <!-- PLANIFICADO -->
  <rect x="1000" y="330" width="380" height="400" rx="16" fill="#FDF9F0" stroke="#C08A3E" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1020" y="362" font-size="15" font-weight="700" fill="#A9742F">PLANIFICADO · HITO 2</text>
  <text x="1020" y="382" font-size="11" fill="#9A8659">No forma parte del sistema actual</text>
  <g font-size="12" fill="#2B2B28">
    <rect x="1020" y="404" width="340" height="40" rx="10" fill="#FBF4E7" stroke="#C89B5A" stroke-dasharray="5 3"/><text x="1036" y="428">Base de datos</text>
    <rect x="1020" y="456" width="340" height="40" rx="10" fill="#FBF4E7" stroke="#C89B5A" stroke-dasharray="5 3"/><text x="1036" y="480">Cuentas y autenticación</text>
    <rect x="1020" y="508" width="340" height="40" rx="10" fill="#FBF4E7" stroke="#C89B5A" stroke-dasharray="5 3"/><text x="1036" y="532">Monitorización continua</text>
    <rect x="1020" y="560" width="340" height="40" rx="10" fill="#FBF4E7" stroke="#C89B5A" stroke-dasharray="5 3"/><text x="1036" y="584">Crawling profundo</text>
  </g>
  <text x="1020" y="626" font-size="10.5" fill="#9A8659">Los contratos (lib/contracts.ts) y las capas ya están</text>
  <text x="1020" y="642" font-size="10.5" fill="#9A8659">preparados para incorporarlos sin rehacer la interfaz.</text>

  <!-- ============ FLEJAS ============ -->
  <g stroke="#2F5545" stroke-width="2">
    <line x1="420" y1="232" x2="508" y2="232" marker-end="url(#arr)"/>
    <line x1="520" y1="300" x2="432" y2="300" marker-end="url(#arr)"/>
    <line x1="920" y1="220" x2="992" y2="220" marker-end="url(#arr)"/>
    <line x1="1000" y1="278" x2="928" y2="278" marker-end="url(#arr)"/>
  </g>
  <line x1="920" y1="520" x2="992" y2="520" stroke="#C08A3E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>

  <g font-size="12" font-weight="700">
    <circle cx="470" cy="232" r="13" fill="#2F5545"/><text x="470" y="236" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="470" cy="300" r="13" fill="#2F5545"/><text x="470" y="304" fill="#FFFFFF" text-anchor="middle">4</text>
    <circle cx="960" cy="220" r="13" fill="#2F5545"/><text x="960" y="224" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="960" cy="278" r="13" fill="#2F5545"/><text x="960" y="282" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="960" cy="520" r="13" fill="#C08A3E"/><text x="960" y="524" fill="#FFFFFF" text-anchor="middle">5</text>
  </g>

  <!-- ============ SECUENCIA ============ -->
  <rect x="40" y="770" width="1340" height="150" rx="12" fill="#FFFFFF" stroke="#DCD6C8"/>
  <text x="60" y="796" font-size="13" font-weight="700" fill="#2F5545" letter-spacing="1">SECUENCIA DE UN ANÁLISIS REAL</text>
  <text x="60" y="820" font-size="12" fill="#2B2B28"><tspan font-weight="700" fill="#2F5545">① </tspan>La SPA valida la URL con el contrato Zod y envía <tspan font-family="Consolas, monospace">POST /api/analyze</tspan> con la URL y los marcos legales elegidos.</text>
  <text x="60" y="842" font-size="12" fill="#2B2B28"><tspan font-weight="700" fill="#2F5545">② </tspan>El endpoint revalida con Zod; <tspan font-family="Consolas, monospace">safety.ts</tspan> verifica protocolo, puertos 80/443, DNS y bloquea SSRF antes de salir a internet.</text>
  <text x="60" y="864" font-size="12" fill="#2B2B28"><tspan font-weight="700" fill="#2F5545">③ </tspan>El sitio externo devuelve HTML, headers y cookies; <tspan font-family="Consolas, monospace">engine.ts</tspan> evalúa dimensiones y genera hallazgos con evidencia.</text>
  <text x="60" y="886" font-size="12" fill="#2B2B28"><tspan font-weight="700" fill="#2F5545">④ </tspan>La respuesta (score · hallazgos · evidencias · plan · normativa) vuelve al navegador; <tspan font-family="Consolas, monospace">store.ts</tspan> la guarda en localStorage.</text>
  <text x="60" y="908" font-size="12" fill="#2B2B28"><tspan font-weight="700" fill="#C08A3E">⑤ </tspan>En Hito 2 la persistencia pasa a base de datos (⑤ punteada) sin cambiar las pantallas: la capa store está aislada.</text>
</svg>
